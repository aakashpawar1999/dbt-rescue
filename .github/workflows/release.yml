name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify application
        run: |
          test -f package-lock.json
          npm install
          npm run lint
          npm test
          npm run build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_name="$(node -p "require('./package.json').name + ' ' + process.argv[1]" "$version")"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$release_name" --generate-notes
