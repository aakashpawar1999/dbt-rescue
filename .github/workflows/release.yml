name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify application
        run: |
          test -f bun.lock
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_name="dbt-rescue $version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$release_name" --generate-notes
